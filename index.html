<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Города: Словесный бой</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Экран выбора страны -->
        <div id="country-screen" class="screen active">
            <h1 id="game-title" data-i18n="game_title">Города: Словесный бой</h1>
            <div id="name-block">
                <h5>Введите имя</h5>
                <input type="text" id="name" name="name" required minlength="1" maxlength="10" size="20">
            </div>
            <h2 class="title" data-i18n="select_country">Выберите страну</h2>
            <div class="countries-grid" id="countries-container"></div>
        </div>

        <!-- Игровой экран -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <button id="back-to-country-btn" class="back-btn" title="Меню" data-i18n="back_to_country_warning">←</button>
                <div class="player-info" id="player-info">
                    <img id="player-avatar" src="avatar.png" alt="Аватар" class="player-avatar">
                    <span id="player-name">Гость</span>
                </div>
                <div class="game-stat">
                    <span data-i18n="lives">Жизни</span>
                    <div class="hearts" id="lives"></div>
                </div>
                <div class="game-stat">
                    <span data-i18n="score">Очки</span>
                    <span id="score">0</span>
                </div>
                <div class="country-info">
                    <img id="country-flag" alt="Флаг страны">
                    <div id="country-name"></div>
                </div>
                <div class="game-stat">
                    <span data-i18n="timer">Время</span>
                    <span id="timer">30</span>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress" id="progress-bar"></div>
            </div>
            <div class="game-content">
                
                <div class="last-city" id="last-city"></div>
                <div class="current-letter-container">
                    <span data-i18n="current_letter">Назовите город на букву</span>
                    <div class="current-letter" id="current-letter"></div>
                </div>

                <div class="input-group">
                    <input type="text" id="city-input" data-i18n-placeholder="enter_city" placeholder="Введите город">
                    <button id="submit-btn" data-i18n="submit">Отправить</button>
                </div>
            </div>
        </div>

        <!-- Экран окончания игры -->
        <div id="end-screen" class="screen">
            <h2 id="result-title" data-i18n="game_over">Игра окончена</h2>
            <p><span data-i18n="final_score_label">Ваш счет:</span> <span id="final_score">0</span></p>
            <div class="leaderboard-container" id="leaderboard-container">
                <h3 data-i18n="leaderboard">Таблица лидеров</h3>
                <div class="leaderboard" id="leaderboard"></div>
            </div>
            <div class="action-buttons">
                <button id="menu-btn" data-i18n="back_to_menu">В меню</button>
            </div>
        </div>

        <!-- Уведомления -->
        <div id="notification" class="notification"></div>
         <!-- Модальное окно подтверждения -->
        <div id="confirm-modal" class="modal">
            <div class="modal-content">
                <p data-i18n="confirm_leave">Вы уверены, что хотите вернуться к выбору страны? Весь прогресс текущей игры будет утерян.</p>
                <div class="modal-buttons">
                    <button id="confirm-leave" data-i18n="yes">Да</button>
                    <button id="cancel-leave" data-i18n="no">Нет</button>
                </div>
            </div>
        </div>
    </div>
    <script src="translations.js"></script>
    <script src="game.js"></script>
</body>
</html>
